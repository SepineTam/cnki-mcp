[project]
name = "cnki-mcp"
version = "0.2.0"
description = "MCP server and CLI for CNKI search and metadata"
readme = "README.md"
keywords = ["cnki", "mcp", "cli", "academic", "papers", "metadata"]
authors = [
    { name = "SongTan", email = "sepinetam@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.28.1,<2.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9,<10",
]

[project.urls]
Homepage = "https://github.com/sepinetam/cnki-mcp"
Documentation = "https://sepinetam.github.io/cnki-mcp/"
Repository = "https://github.com/sepinetam/cnki-mcp"
Issues = "https://github.com/sepinetam/cnki-mcp/issues"
Changelog = "https://github.com/sepinetam/cnki-mcp/releases"

[project.scripts]
cnki-mcp = "cnki_mcp:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
]
ignore = [
    "UP009",
]

[tool.ruff.lint.isort]
known-first-party = ["cnki_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
